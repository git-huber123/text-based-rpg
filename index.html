      function drawText(text, x, y, color = "black", align = "center", size = 20) {
        ctx.font = `${size}px "Courier New", Courier, monospace`;
        ctx.fillStyle = color;
        ctx.textAlign = align; // Options: 'left', 'center', 'right', 'start', 'end'

        ctx.fillText(text, x, y);
      }

      function drawRect(x, y, width, height, fillColor = "black", strokeColor = "black", lineWidth = 2) {
        ctx.lineWidth = lineWidth;

        // Draw the filled area
        if (fillColor) {
          ctx.fillStyle = fillColor;
          ctx.fillRect(x, y, width, height);
        }

        // Draw the outline
        if (strokeColor) {
          ctx.strokeStyle = strokeColor;
          ctx.strokeRect(x, y, width, height);
        }
      }

      let currentCell;

      function getMapPool() {
        const totalSquares = 51 * 51 - 1; // 2601 total squares, subtract 1 for the base
        const mapPool = [];

        // Define the base targets
        const targets = {
          S: 1,
          M: 3,
          C: 10,
          V: 50,
          T: 90,
          O: 120,
        };

        // Helper function to get a random count within +/- 10%
        function getRandomCount(target) {
          if (target === 0) return 0;

          // 10% down, rounded down
          let min = Math.floor(target * 0.9);
          // 10% up, rounded up
          let max = Math.ceil(target * 1.1);

          // Prevent targets from hitting 0 unless the base target was 0
          if (min === 0 && target > 0) {
            min = 1;
          }

          // Return a random integer between min and max (inclusive)
          return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 1. Roll and push the randomized target quantities into the array
        for (const [type, targetValue] of Object.entries(targets)) {
          const count = getRandomCount(targetValue);
          for (let i = 0; i < count; i++) {
            mapPool.push(type);
          }
        }

        // 2. Fill whatever remains of the 2601 squares with "#"
        while (mapPool.length < totalSquares) {
          mapPool.push("#");
        }

        // 3. Shuffle the array (Fisher-Yates Shuffle)
        for (let i = mapPool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [mapPool[i], mapPool[j]] = [mapPool[j], mapPool[i]];
        }

        return mapPool; // Flat array of 2601 squares with variable targets
      }

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth * 0.9;
      canvas.height = window.innerHeight * 0.9;

      const map = [];
      const width = 51;
      const height = 51;

      let permVisibleCells = new Array(width * height).fill(false);
      let currentVisibleCells = new Array(width * height).fill(false);

      let lastMove = 0;

      const keys = {};

      const hasBeenLooted = new Array(width * height).fill(false);

      const enemies = new Array(width * height).fill(false);

      window.addEventListener("keydown", (ev) => {
        keys[ev.code.toLowerCase().replace("key", "")] = true;
      });
      window.addEventListener("keyup", (ev) => {
        keys[ev.code.toLowerCase().replace("key", "")] = false;
      });

      let currentScreen = "map";

      let currentEnemy = null;

      let splashText = "";

      const p = {
        x: 26,
        y: 26,
        health: 5,
        healthCapacity: 5,
        water: 7,
        food: 5,
        waterCapacity: 7,
        foodCapacity: 5,
        inv: [
          { name: "leather", count: 10 },
          { name: "bronze", count: 3 },
        ],
        invSize: 5,
        weapon: {
          name: "stick",
          damage: 1,
        },
        visibleDistance: 3,
      };

      let oldSpotBeforeMove = [26, 26];

      let textForConfirm = "";

      let hasBeatBoss = false;

      const weaponMap = {
        stick: 1,
        "magic staff": 3,
        "mechanical construct": 6,
        "automatic rifle": 5,
        "supersonic blaster": 8,
        staff: 2,
        whip: 1.5,
        "metal sword": 2.5,
        "golden spear": 3.5,
        "royal flail": 5,
        "diamond broadsword": 7,
        "spacetime cleaver": 12,
      };

      const pool = getMapPool();
      let pushedBase = false;
      for (let y = 0; y < height; y++) {
        const row = [];
        for (let x = 0; x < width; x++) {
          if (x === Math.ceil(width / 2) && y === Math.ceil(height / 2)) {
            row.push("+");
            pushedBase = true;
          } else {
            row.push(pool[pushedBase ? y * width + x - 1 : y * width + x]);
          }
        }
        map.push(row);
      }

      function checkDistance(y, x) {
        const dX = p.x - x;
        const dY = p.y - y;
        if (dX * dX + dY * dY <= p.visibleDistance * p.visibleDistance) return true;
        return false;
      }

      function renderMap() {
        const yPerRow = Math.floor(canvas.height / (height * 1.1));
        const xPerSymbol = Math.floor(canvas.width / (height * 1.1));
        const distPerRow = Math.min(yPerRow, xPerSymbol);
        for (let i = 0; i < map.length; i++) {
          const row = map[i];
          let string = "";
          for (let j = 0; j < row.length; j++) {
            let symbol = "";
            if (currentVisibleCells[idx(i, j)]) {
              symbol = row[j];
            } else if (checkDistance(i, j)) {
              currentVisibleCells[idx(i, j)] = true;
              symbol = row[j];
            }
            if (p.x === j && p.y === i) {
              symbol = ".";
            }
            let color = "black";

            if (hasBeenLooted[idx(i, j)]) {
              color = symbol === "#" || symbol === "_" || symbol === "." ? cellMap[symbol].color : "gray";
            } else if (cellMap[symbol]) {
              color = cellMap[symbol].color;
            }
            drawText(symbol, distPerRow * (j + 1), distPerRow * (i + 1), color);
          }
        }
        drawText(
          `Food: ${p.food}/${p.foodCapacity}, Water: ${p.water}/${p.waterCapacity}, Health: ${p.health}/${p.healthCapacity}, Inventory: [${p.inv.map((item) => `${item.name}: ${item.count}`).join(", ")}]`,
          (canvas.width * 2) / 3,
          (canvas.height * 2) / 3,
          "white",
        );
        drawText(splashText, (canvas.width * 2) / 3, canvas.height / 3, "white");
      }

      function idx(y = p.y, x = p.x) {
        return y * width + x;
      }

      function handleInput() {
        if (currentScreen === "map") {
          if (keys.enter && map[p.y][p.x] === "+") {
            currentScreen = "base";
            lastSelectionChangeTime = performance.now();

            return;
          }
          if (performance.now() - lastMove > 100) {
            lastMove = performance.now();
            let moved = false;
            if (keys.w && p.y > 0) {
              p.y -= 1;
              moved = true;
            }
            if (keys.s && p.y < height - 1) {
              p.y += 1;
              moved = true;
            }
            if (keys.a && p.x > 0) {
              p.x -= 1;
              moved = true;
            }
            if (keys.d && p.x < width - 1) {
              p.x += 1;
              moved = true;
            }
            if (moved) {
              oldSpotBeforeMove = [p.x, p.y];
              if (p.water > 0) {
                p.water -= 1;
              } else {
                p.health -= 1;
              }
              const spot = map[p.y][p.x];
              if (spot === "#" && p.food > 0) {
                map[p.y][p.x] = "_";
                p.food -= 1;
              } else if (spot === "+") {
                p.water = p.waterCapacity;
                p.food = p.foodCapacity;
                p.health = p.healthCapacity;
                permVisibleCells = structuredClone(currentVisibleCells);
              }
              if (r() < cellMap[spot].interactChance && !hasBeenLooted[idx(p.y, p.x)]) {
                if (cellMap[spot].isSkippable) {
                  textForConfirm = cellMap[spot].textForConfirm;
                  currentScreen = "confirm" + spot.toUpperCase();
                } else {
                  currentScreen = "interact" + spot.toUpperCase();
                }
              }
            }
          }
        }
        if (currentScreen.includes("interact") && !currentScreen.includes("enemy")) {
          currentEnemy = enemies[idx()] ? enemies[idx()] : cellMap[currentScreen.replace("interact", "")].getEnemy();
          enemies[idx] = structuredClone(currentEnemy);

          if (keys.enter) {
            keys.enter = false;
            currentScreen += "enemy";
          }
        }
        if (currentScreen.includes("interact") && currentScreen.includes("enemy")) {
          if (keys.enter) {
            keys.enter = false;
            updateEnemyScreen();
          }
        }
        if (currentScreen === "reward") {
          if (keys.enter) {
            keys.enter = false;
            currentScreen = "map";
            hasBeatBoss = false;
          }
        }
        if (p.health < p.healthCapacity && currentScreen === "map" && keys.space && p.food > 0) {
          p.food -= 1;
          p.health += 1;
          if (p.health > p.healthCapacity) {
            const diff = Math.round((p.health - p.healthCapacity) * 2) / 2;
            p.health = p.healthCapacity;
            p.food += diff;
          }
        }
        if (currentScreen === "death" && keys.enter) currentScreen = "map";
        if (currentScreen.includes("confirm")) {
          if (keys.y) {
            textForConfirm = "";
            currentScreen = "interact" + currentScreen.replace("confirm", "");
          }
          if (keys.n) {
            textForConfirm = "";
            currentScreen = "map";
            p.x = oldSpotBeforeMove.x;
            p.y = oldSpotBeforeMove.y;
          }
        }
        if (currentScreen === "upgrade" && keys.escape) {
          lastSelectionChangeTime = performance.now();
          currentScreen = "base";
        }

        if (currentScreen === "upgrade" && performance.now() - lastSelectionChangeTime > 100) {
          if (keys.w) {
            if (selectedSection === "section" && selectedUpgradeSection > 0) {
              selectedUpgradeSection -= 1;
              selectedUpgradeSectionType = 0;
              lastSelectionChangeTime = performance.now();
            }
            if (selectedSection === "types" && selectedUpgradeSectionType > 0) {
              selectedUpgradeSectionType -= 1;
              lastSelectionChangeTime = performance.now();
            }
          }
          if (keys.s) {
            if (selectedSection === "section" && selectedUpgradeSection < 4) {
              selectedUpgradeSection += 1;
              selectedUpgradeSectionType = 0;
              lastSelectionChangeTime = performance.now();
            }
            if (
              selectedSection === "types" &&
              selectedUpgradeSectionType < [backpackTypes, foodTypes, waterTypes, healthTypes, weaponTypes][selectedUpgradeSection].length - 1
            ) {
              selectedUpgradeSectionType += 1;
              lastSelectionChangeTime = performance.now();
            }
          }
          if (keys.a && selectedSection === "types") selectedSection = "section";
          if (keys.d && selectedSection === "section") selectedSection = "types";
          if (keys.enter && selectedSection === "types") {
            if (allOptions[selectedUpgradeSection][selectedUpgradeSectionType].owned) {
              select(selectedUpgradeSection, selectedUpgradeSectionType);
            } else {
              handleBuy(selectedUpgradeSection, selectedUpgradeSectionType);
            }
          }
        }
        if (currentScreen === "base") {
          if (keys.w && selectedBaseOption > 0 && performance.now() - lastSelectionChangeTime > 100) {
            lastSelectionChangeTime = performance.now();
            selectedBaseOption -= 1;
          }
          if (keys.s && selectedBaseOption < baseOptions.length - 1 && performance.now() - lastSelectionChangeTime > 100) {
            lastSelectionChangeTime = performance.now();
            selectedBaseOption += 1;
          }
          if (keys.enter && performance.now() - lastSelectionChangeTime > 100) {
            currentScreen = baseOptions[selectedBaseOption].name;
            lastSelectionChangeTime = performance.now();
          }

      function handleBuy(sec, type) {
        let resources = allOptions[sec][type].resources;
        let fakeInv = structuredClone(p.inv);
        let fakeBaseInv = structuredClone(baseInv);
        for (let i = 0; i < fakeInv.length; i++) {
          const item = fakeInv[i];
          for (let j = 0; j < resources.length; j++) {
            const resource = resources[j];
            if (item.count >= resource.count && item.name === resource.name) {
              fakeInv[i].count -= resource.count;
              resources.splice(j, 1);
              break;
            }
          }
        }
        for (let i = 0; i < fakeBaseInv.length; i++) {
          const item = fakeBaseInv[i];
          for (let j = 0; j < resources.length; j++) {
            const resource = resources[j];
            if (item.count >= resource.count && item.name === resource.name) {
              fakeBaseInv[i].count -= resource.count;
              resoures.splice(j, 1);
              break;
            }
          }
        }
        if (resources.length > 0) return;
        for (let i = fakeInv.length - 1; i >= 0; i--) {
          if (fakeInv[i].count <= 0) fakeInv.splice(i, 1);
        }
        for (let i = fakeBaseInv.length - 1; i >= 0; i--) {
          if (fakeBaseInv[i].count <= 0) fakeBaseInv.splice(i, 1);
        }
        p.inv = structuredClone(fakeInv);
        baseInv = structuredClone(fakeBaseInv);
        const upgrade = allOptions[sec][type];
        upgrade.owned = true;
        switch (sec) {
          case 0:
            p.invSize = upgrade.capacity;
            break;
          case 1:
            p.foodCapacity = upgrade.capacity;
            break;
          case 2:
            p.waterCapacity = upgrade.capacity;
            break;
          case 3:
            p.healthCapacity = upgrade.capacity;
            break;
          case 4:
            p.weapon = { name: upgrade.name, damage: weaponMap[upgrade.name] };
            break;
        }
      }

      function random(min = 0, max = 1) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function r(min = 0, max = 1) {
        return Math.random() * (max - min) + min;
      }

      function updateEnemyScreen() {
        currentEnemy.health -= p.weapon.damage;
        p.health -= currentEnemy.damage;
        if (p.health <= 0) {
          resetPlayer();
          return;
        }
        if (currentEnemy.health <= 0) {
          currentScreen = "reward";
          if (currentEnemy.name === "void-touched anomaly") {
            hasBeatBoss = true;
            alert("You've beat the final boss! Good job!");
          }
          let reward = [];
          const rewardPool = cellMap[currentCell].reward(currentEnemy);
          currentEnemy = null;
          for (const item of rewardPool) {
            if (item.type === "inv") reward.push({ name: item.name, count: random(item.min, item.max) });
            if (item.type === "weapon" && weaponMap[item.name] > p.weapon.damage) p.weapon = { name: item.name, damage: weaponMap[item.name] };
            if (item.type === "food") p.food = Math.min(p.foodCapacity, p.food + random(item.min, item.max));
            if (item.type === "water") p.water = Math.min(p.waterCapacity, p.water + random(item.min, item.max));
          }
          currentReward = reward;
          for (const r of reward) {
            let foundInvItem = false;
            for (let i = 0; i < p.inv.length; i++) {
              const item = p.inv[i];
              if (item.name === r.name) {
                p.inv[i].count += r.count;
                foundInvItem = true;
              }
            }
            if (!foundInvItem) {
              p.inv.push(r);
            }
          }
          if (p.inv.length > p.invSize) p.inv.length = p.invSize;

          hasBeenLooted[idx(p.y, p.x)] = true;
        }
      }
